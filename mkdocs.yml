site_name: Bro Documentation
site_description: Documentation for Bro, a local-first Streamlit application for text generation, document Q&A, semantic search, prompt engineering, and data management.
site_author: Terry D. Eppler
site_url: https://is-leeroy-jenkins.github.io/Bro/

repo_url: https://github.com/is-leeroy-jenkins/Bro
repo_name: is-leeroy-jenkins/Bro
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Terry D. Eppler

theme:
  name: material
  language: en
  favicon: img/favicon.ico
  logo: img/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_root_members_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            merge_init_into_class: true
            docstring_section_style: table
            heading_level: 2
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/bro.css

extra_javascript:
  - assets/js/bro.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/is-leeroy-jenkins/Bro
      name: Lil Bro

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Local Model: local-model.md
  - User Guide:
      - Text Generation: text-generation.md
      - Document Q&A: document-qna.md
      - Semantic Search: semantic-search.md
      - Prompt Engineering: prompt-engineering.md
      - Data Management: data-management.md
  - API Reference:
      - Overview: api/index.md
      - Application: api/app.md
      - Configuration: api/config.md
      - Logging: api/boogr.md
  - Development: development.md