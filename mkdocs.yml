site_name: Bro
site_description: Local-first Gemma 3 text, vision, retrieval, prompt-engineering, semantic-search, and SQLite data-management application.
site_author: Terry D. Eppler
site_url: https://is-leeroy-jenkins.github.io/Bro/

repo_name: is-leeroy-jenkins/Bro
repo_url: https://github.com/is-leeroy-jenkins/Bro

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
  palette:
    - scheme: slate
      primary: blue
      accent: light blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/css/bro.css

extra_javascript:
  - assets/js/bro.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Local Model: local-model.md
  - Application Modes:
      - Text Generation: text-generation.md
      - Image to Text: image-to-text.md
      - Document Q&A: document-qna.md
      - Semantic Search: semantic-search.md
      - Prompt Engineering: prompt-engineering.md
      - Data Management: data-management.md
  - API Reference:
      - Overview: api/index.md
      - App: api/app.md
      - Configuration: api/config.md
      - Logging: api/boogr.md
  - Development: development.md
